name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .   # repo root IS the aria/ folder

    env:
      # Minimal config so pydantic-settings doesn't complain.
      # No real credentials needed — LLM/email/WhatsApp are all mocked in tests.
      LLM_PROVIDER: groq
      GROQ_API_KEY: ci_placeholder_not_real
      ANTHROPIC_API_KEY: ""
      SMTP_HOST: localhost
      SMTP_PORT: "587"
      SMTP_USER: test
      SMTP_PASSWORD: test
      EMAIL_FROM_ADDRESS: ci@beyondsure.in
      DATABASE_URL: "sqlite:///./ci_test.db"
      HUMAN_APPROVAL_MODE: "true"
      BASE_URL: "http://localhost:8000"
      ALERT_EMAIL: ci@beyondsure.in
      WHATSAPP_API_TOKEN: ""
      WHATSAPP_PHONE_NUMBER_ID: ""
      WHATSAPP_BUSINESS_NUMBER: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest \
            --tb=short \
            -v \
            --cov=. \
            --cov-omit="tests/*,*/__pycache__/*" \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Clean up test DB
        if: always()
        run: rm -f ci_test.db
