[tool:pytest]
# Intentionally empty — pytest config lives in pytest.ini.
# This file exists only to hold coverage settings.

[coverage:run]
source = .
omit =
    tests/*
    */__pycache__/*

[coverage:report]
show_missing = true
fail_under = 55
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
